name: Temporary testtailwind lockfile refresh

on:
  push:
    branches:
      - testtailwind
    paths:
      - .github/workflows/testtailwind-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: testtailwind

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pnpm lockfile for Tailwind v4"
            git push origin HEAD:testtailwind
          fi

          git rm .github/workflows/testtailwind-lockfile.yml
          git commit -m "chore: remove temporary lockfile refresh workflow"
          git push origin HEAD:testtailwind
